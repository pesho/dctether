# Build release binaries for a pushed tag vX.Y.Z, publish a GitHub release,
# and (if the TAP_TOKEN secret is set) update pesho/homebrew-tap.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.100"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo test --locked
      # Pure-Rust dependencies: rust-lld plus Rust's bundled musl CRT is
      # enough, no cross C toolchain.
      - run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            RUSTFLAGS="-C linker=rust-lld" cargo build --locked --release --target "$t"
            mkdir -p "build/$t" && cp "target/$t/release/dctether" "build/$t/"
          done
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: build }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo test --locked
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$t"
            mkdir -p "build/$t" && cp "target/$t/release/dctether" "build/$t/"
          done
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: build }

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    env:
      # Job-level, so the tap step's `if` can see whether it is set.
      TAP_TOKEN: "${{ secrets.TAP_TOKEN }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: build, merge-multiple: true }
      - name: Check tag matches Cargo.toml and the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"$" Cargo.toml || { echo "tag $GITHUB_REF_NAME != Cargo.toml version"; exit 1; }
          scripts/changelog-section.sh "$v" > release-notes.md
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: chmod +x build/*/dctether && scripts/package.sh "$VERSION" build dist
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md dist/*.tar.gz dist/SHA256SUMS
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/pesho/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/render-formula.sh "$VERSION" dist/SHA256SUMS > tap/Formula/dctether.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dctether.rb
          git commit -m "dctether $VERSION"
          git push
