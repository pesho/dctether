[package]
name = "dctether"
version = "0.4.0"
edition = "2024"
description = "Forward the host SSH agent, X11 display and browser opener into devcontainer exec sessions"
license = "MIT"
repository = "https://github.com/pesho/dctether"
readme = "README.md"
keywords = ["devcontainer", "ssh-agent", "x11", "docker"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
bytes = "1.12.2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "io-std", "process", "macros", "sync", "signal", "time"] }

[profile.release]
# Optimize for size: about 15% smaller than opt-level 3 (1.04 -> 0.88 MB for
# x86_64 musl), and dctether spends its time waiting on sockets and pipes.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
